<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="指定した日付の前日に関する記録を取得します。">
<title>昨日生成機 | Yesterday Retrieval System</title>
<style>
:root{--navy:#173d5a;--ink:#182027;--line:#aeb8be;--paper:#fbfbfa;--bg:#e6e8e9;--green:#4c956c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;color:#fff;background:var(--navy);border-bottom:3px solid #0d273a}.brand{display:flex;align-items:center;gap:12px}.brand b{font:700 13px/1 Consolas,monospace;letter-spacing:.12em}.brand span{padding-left:12px;border-left:1px solid #ffffff55;font-weight:700}.status{font:600 11px/1 Consolas,monospace;letter-spacing:.06em}.dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--green)}.grid{min-height:calc(100vh - 92px);display:grid;grid-template-columns:220px minmax(480px,1fr) 245px;gap:1px;background:var(--line)}.panel{min-width:0;background:#f4f5f5}.heading{height:47px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c4cacf;background:#eceeef;font-size:13px;font-weight:700}.heading small{color:#687780;font:10px/1 Consolas,monospace}.history{display:flex;flex-direction:column}.history-list{flex:1;padding:8px}.history-row{width:100%;height:42px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border:1px solid transparent;background:transparent;color:#29363e;text-align:left;font:12px/1 Consolas,monospace}.history-row:hover{background:#e7ebed}.history-row.active{background:#dce6ec;border-color:#9aabb5;box-shadow:inset 3px 0 #214f6d}.history-row small{font-size:9px;color:#66757e}.device{padding:14px;border-top:1px solid #ccd2d5;color:#66757e;font-size:11px}.main{padding:23px 27px 30px;background:#eef0f1}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;padding:16px;background:#f8f9f9;border:1px solid var(--line);border-top:3px solid #244e69}.controls label,.known{display:flex;flex-direction:column;gap:6px}.controls label span,.target span,.known>span{color:#4f5f68;font-size:12px;font-weight:700}.controls input{height:41px;padding:0 10px;border:1px solid #9da9b0;background:#fff}.target{height:41px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 10px}.target span{font-size:10px;font-weight:500}.get{height:41px;padding:0 17px;border:1px solid #0c2d45;border-radius:2px;color:#fff;background:var(--navy);font-weight:700}.get:disabled{opacity:.55}.known{margin-top:12px;padding:13px 16px;background:#f8f9f9;border:1px solid #b8c1c6}.known textarea{min-height:58px;resize:vertical;padding:8px 10px;border:1px solid #aab4ba;background:#fff}.known em{font-style:normal;color:#748189;font-size:10px}.record{min-height:390px;margin-top:15px;border:1px solid var(--line);background:var(--paper);box-shadow:0 2px 5px #26303615}.record-head{min-height:88px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c3c9cc;background:linear-gradient(#fff,#f4f5f5)}.record-head small{font:10px/1 Consolas,monospace;letter-spacing:.1em;color:#687780}.record-head h1{margin:7px 0 0;font:600 23px/1.4 "Yu Mincho","Hiragino Mincho ProN",serif}.seal{padding:6px 9px;border:1px solid #9cae9f;color:#315b3f;background:#edf4ef;font-size:11px}.timeline{margin:0;padding:18px 23px 20px;list-style:none}.timeline li{min-height:41px;padding:8px 0;display:grid;grid-template-columns:64px 1fr;align-items:baseline;border-bottom:1px dotted #c9ced1}.timeline time{color:#3a5060;font:600 13px/1.5 Consolas,monospace}.timeline span{font:16px/1.55 "Yu Mincho","Hiragino Mincho ProN",serif}.actions{padding:10px 15px;display:flex;gap:6px;border-top:1px solid #c8ced1;background:#f0f2f2}.actions button{height:33px;padding:0 10px;border:1px solid #aab4b9;background:#fafafa;color:#273740;font-size:11px}.empty,.loading{min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#69777e}.empty b,.loading b{color:#37464f}.empty span,.loading span{margin-top:5px;font-size:11px}.loading b{font:700 13px/1 Consolas,monospace;letter-spacing:.14em}.meta{margin:0;padding:5px 15px}.meta div{padding:12px 0;border-bottom:1px solid #d3d7d9}.meta dt{margin-bottom:5px;color:#6a787f;font-size:10px}.meta dd{margin:0;font-size:13px;font-weight:700;overflow-wrap:anywhere}.meta .mono{font:11px/1.4 Consolas,monospace}.meta .confidence dd{color:var(--navy);font:500 33px/1 Consolas,monospace}.meta .confidence small{font-size:13px}.muted{padding:15px;color:#78858b;font-size:11px}.logbar{background:#d6dadc;border-top:1px solid #fff}.logbar>button{width:100%;height:38px;padding:0 19px;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:#40515b;font:700 10px/1 Consolas,monospace;letter-spacing:.08em}.logs{max-height:140px;overflow:auto;padding:11px 20px;display:flex;flex-direction:column;gap:5px;background:#17232b;color:#b7c8d1;font:10px/1.4 Consolas,monospace}.modal{position:fixed;inset:0;padding:20px;display:none;place-items:center;background:#0007}.modal.open{display:grid}.dialog{width:min(600px,100%);max-height:80vh;overflow:auto;padding:20px;border:1px solid #849299;background:#f5f6f6;box-shadow:0 12px 40px #0005}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between}.dialog h2{margin:0;font-size:18px}.dialog-head button{border:0;background:transparent;font-size:22px}.rev{margin-top:15px;border:1px solid #bcc4c8}.rev article{padding:12px 14px;border-bottom:1px solid #cdd2d5;background:#fff}.rev article:last-child{border-bottom:0}.rev header{display:grid;grid-template-columns:40px 1fr auto;gap:8px;color:#748087;font:10px/1.4 Consolas,monospace}.rev p{margin:9px 0 0;font:14px/1.5 "Yu Mincho",serif}.rev p b{margin-right:14px;font-family:Consolas,monospace;color:#345166}@media(max-width:950px){.grid{grid-template-columns:1fr 225px}.history{grid-column:1/-1;order:3}.history-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.device{display:none}}@media(max-width:680px){.top{padding:0 13px}.brand b{display:none}.grid{display:flex;flex-direction:column}.main{order:1;padding:13px 9px 20px}.info{order:2}.history{order:3}.controls{grid-template-columns:1fr 1fr;padding:12px}.get{grid-column:1/-1}.record-head{padding:15px}.record-head h1{font-size:19px}.seal{display:none}.timeline{padding:12px 15px}.timeline li{grid-template-columns:54px 1fr}.timeline span{font-size:15px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>▣ YESTERDAY ARCHIVE</b><span>昨日生成機</span></div><div class="status"><i class="dot"></i>STATUS: NORMAL</div></header>
<div class="grid">
<aside class="panel history"><div class="heading"><span>照会履歴</span><small id="count">00 RECORDS</small></div><div class="history-list" id="history"><p class="muted">照会済の記録はありません。</p></div><div class="device">記録媒体：このブラウザ<br>同期状態：ローカル</div></aside>
<section class="panel main">
  <div class="controls"><label><span>対象日</span><input id="date" type="date"></label><div class="target"><span>生成される昨日</span><strong id="yesterday"></strong></div><button class="get" id="get">昨日を取得</button></div>
  <label class="known"><span>今日について分かっていること（任意）</span><textarea id="known" placeholder="例：今日は傘を持っている"></textarea><em>昨日の照合精度向上に使用されます。</em></label>
  <div class="record" id="record"><div class="empty"><b>昨日はまだ取得されていません</b><span>対象日を確認し、「昨日を取得」を実行してください。</span></div></div>
</section>
<aside class="panel info"><div class="heading"><span>記録情報</span><small>RECORD INFO</small></div><div id="meta" class="muted">記録を取得すると、照合情報がここに表示されます。</div></aside>
</div>
<footer class="logbar"><button id="logtoggle"><span>⌄ SYSTEM LOG</span><small>YRS 1.0.4 / CONNECTION NORMAL</small></button><div class="logs" id="logs" hidden>NO LOCAL OPERATIONS RECORDED</div></footer>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><div><h2>昨日の変更履歴</h2><small id="modaldate"></small></div><button id="close" aria-label="閉じる">×</button></div><div class="rev" id="revisions"></div></div></div>
<script>
(()=>{"use strict";const KEY="yesterday-retrieval-system-standalone-v1";
const pool={morning:["起床。","目覚ましを止める。","窓を開ける。","水を飲む。","しばらく天井を見る。","昨夜の通知を確認する。"],noon:["昼食をとる。","机の上を片づける。","短いメッセージを送る。","コンビニに寄る。","同じページを二度読む。","予定をひとつ確認する。"],afternoon:["駅へ向かう。","いつもの道を通る。","少し遠回りをする。","買物をする。","動画を見る。","届いた連絡に返事をする。"],evening:["帰宅。","夕食をとる。","風呂に入る。","明日の準備をする。","照明をひとつ消す。","横になって時刻を確認する。"],night:["就寝。","眠れずに時刻を確認する。","端末を充電する。","今日のことを思い返す。"]};
const subtle=["来たことのあるような場所を通る。","誰かに名前を呼ばれたと思う。","この時点では、まだその名前を知らない。","昨日と同じ音を聞く。","この出来事を忘れる。","帰宅した記憶だけが残る。"],details=["知らない番号から着信。応答せず。","改札の近くにレシートが落ちている。","鞄の中に見覚えのない紙片がある。","閉まっている店の前で立ち止まる。","雨は降っていない。傘を持っている。","同じ服の人物を二度見かける。"];
const $=s=>document.querySelector(s),dateEl=$("#date"),yesterdayEl=$("#yesterday"),recordEl=$("#record"),metaEl=$("#meta"),historyEl=$("#history"),countEl=$("#count"),getEl=$("#get"),knownEl=$("#known"),modal=$("#modal"),logsEl=$("#logs");let selected=null;
const ds=(d=new Date)=>{const o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10)},prev=s=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-1);return ds(d)},fmt=(s,w=false)=>{const d=new Date(s+"T12:00:00"),x=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;return w?x+`　${"日月火水木金土"[d.getDay()]}曜日`:x},hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0},rng=n=>()=>{n|=0;n=n+0x6d2b79f5|0;let t=Math.imul(n^n>>>15,1|n);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},pick=(a,r)=>a[Math.floor(r()*a.length)],time=(a,b,r)=>String(a+Math.floor(r()*(b-a))).padStart(2,"0")+":"+String(Math.floor(r()*60)).padStart(2,"0"),stamp=()=>new Date().toLocaleString("ja-JP",{hour12:false}),lt=()=>new Date().toLocaleTimeString("ja-JP",{hour12:false}),clone=e=>e.map(x=>({...x}));
const fresh=()=>({worldId:crypto.randomUUID(),retrievalCount:0,motifs:{redUmbrella:false},records:{},logs:[]});let world;try{world=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){world=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(world))}function eventsFor(date,known){const r=rng(hash(date+":"+world.worldId)),periods=[["morning",6,10],["noon",11,14],["afternoon",14,18],["evening",18,22],["night",22,24]],ev=periods.map((p,i)=>({id:date+"-"+i,time:time(p[1],p[2],r),text:pick(pool[p[0]],r),kind:"routine",certainty:.96+r()*.035})),level=Math.min(5,Math.floor(world.retrievalCount/4));if(r()>.34)ev.push({id:date+"-d",time:time(9,19,r),text:pick(details,r),kind:"detail",certainty:.9});if(r()<.1+level*.06)ev.push({id:date+"-s",time:time(12,21,r),text:pick(subtle,r),kind:"subtle",certainty:.82});if(/傘|雨/.test(known)||world.motifs.redUmbrella||(level>0&&r()<.13)){ev.push({id:date+"-u",time:time(13,19,r),text:world.motifs.redUmbrella?pick(["駅前で赤い傘を見かける。","赤い傘をどこへ置いたのか思い出せない。","玄関に赤い傘がある。"],r):"駅前で赤い傘を拾う。",kind:"motif",certainty:.948})}if(/大学|学校|仕事/.test(known))ev.push({id:date+"-k1",time:time(19,23,r),text:"明日の外出に必要なものを鞄へ入れる。",kind:"detail",certainty:.91});if(/カレー|昼食|食事/.test(known))ev.push({id:date+"-k2",time:time(19,23,r),text:level>=3?"明日、昼食を外で済ませることになる。":"明日は昼食を外で済ませようと思う。",kind:level>=3?"causal":"detail",certainty:.88});if(Object.values(world.records).some(x=>x.date>ds()&&x.events.some(e=>e.kind==="motif"))&&date<=ds()&&!ev.some(e=>e.kind==="motif"))ev.push({id:date+"-fu",time:time(13,19,r),text:"赤い傘を持った人物を見送る。",kind:"motif",certainty:.987});if(level>=4&&r()<.18)ev.push({id:date+"-c",time:time(18,23,r),text:"明日の記録に必要なため、この出来事が補完される。",kind:"causal",certainty:.99});return ev.sort((a,b)=>a.time.localeCompare(b.time))}
function mutate(rec){const ev=clone(rec.events),c=ev.filter(e=>e.kind!=="routine"),t=c[world.retrievalCount%Math.max(1,c.length)]||ev[Math.floor(ev.length/2)];if(t){if(t.text.includes("拾う。"))t.text=t.text.replace("拾う。","拾ったと思う。");else if(t.text.includes("拾ったと思う。"))t.text="赤い傘を持って駅前を通過。";else t.text=t.text.replace(/。$/,"")+"、と思われる。";t.certainty=Math.max(0,t.certainty-.24)}const n=rec.revisions.length+1,editor=n>=3&&world.retrievalCount%3===0?"質問者":"SYSTEM";return{...rec,events:ev,retrievals:rec.retrievals+1,status:"UPDATED",confidence:Math.max(61.2,+(rec.confidence-1.7).toFixed(1)),lastChecked:stamp(),revisions:[...rec.revisions,{number:n,at:stamp(),editor,events:clone(ev)}]}}
function render(){const list=Object.values(world.records).sort((a,b)=>b.date.localeCompare(a.date));countEl.textContent=String(list.length).padStart(2,"0")+" RECORDS";historyEl.innerHTML=list.length?list.map(x=>`<button class="history-row ${selected===x.date?"active":""}" data-date="${x.date}"><span>▧ ${x.date.replaceAll("-","/")}</span><small>${x.status}</small></button>`).join(""):'<p class="muted">照会済の記録はありません。</p>';historyEl.querySelectorAll("button").forEach(b=>b.onclick=()=>select(b.dataset.date));const rec=selected&&world.records[selected];if(!rec){recordEl.innerHTML='<div class="empty"><b>昨日はまだ取得されていません</b><span>対象日を確認し、「昨日を取得」を実行してください。</span></div>';metaEl.className="muted";metaEl.textContent="記録を取得すると、照合情報がここに表示されます。";return}recordEl.innerHTML=`<div class="record-head"><div><small>RETRIEVED RECORD</small><h1>${fmt(rec.date,true)}</h1></div><span class="seal">✓ 確認済</span></div><ol class="timeline">${rec.events.map(e=>`<li><time>${e.time}</time><span>${e.text}</span></li>`).join("")}</ol><div class="actions"><button id="again">↻ 再照合</button><button id="versions">◷ 変更履歴</button></div>`;metaEl.className="";metaEl.innerHTML=`<dl class="meta"><div><dt>記録番号</dt><dd class="mono">${rec.recordId}</dd></div><div><dt>状態</dt><dd><i class="dot"></i>NORMAL</dd></div><div class="confidence"><dt>信頼度</dt><dd>${rec.confidence.toFixed(1)}<small>%</small></dd></div><div><dt>確認済記録</dt><dd>${rec.events.length-rec.missing}</dd></div><div><dt>補完記録</dt><dd>${rec.missing}</dd></div><div><dt>矛盾</dt><dd>${rec.contradictions}</dd></div><div><dt>版</dt><dd>v${rec.revisions.length}</dd></div><div><dt>最終照合</dt><dd>${rec.lastChecked}</dd></div></dl>`;$("#again").onclick=()=>retrieve(true);$("#versions").onclick=versions}
function select(date){selected=date;const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+1);dateEl.value=ds(d);updateDate();render()}function updateDate(){const d=prev(dateEl.value);yesterdayEl.textContent=fmt(d);getEl.textContent=world.records[d]?"昨日を再取得":"昨日を取得"}
function retrieve(force=false){const date=prev(dateEl.value),existing=world.records[date];getEl.disabled=true;recordEl.innerHTML='<div class="loading"><b>INDEXING...</b><span id="loadtext">索引を照合しています</span></div>';const stages=["索引を照合しています","欠損記録を補完しています","時間的整合性を確認しています"];let i=0;const timer=setInterval(()=>{i=Math.min(i+1,2);const x=$("#loadtext");if(x)x.textContent=stages[i]},330);setTimeout(()=>{clearInterval(timer);world.retrievalCount++;let rec;if(existing)rec=mutate(existing);else{const ev=eventsFor(date,knownEl.value);rec={date,recordId:`YD-${date.replaceAll("-","")}-${String(hash(date+":"+world.worldId)%10000).padStart(4,"0")}`,confidence:+(91.8+(hash(date)%72)/10).toFixed(1),missing:hash(date+":missing")%3,contradictions:0,status:"NORMAL",lastChecked:stamp(),retrievals:1,events:ev,revisions:[{number:1,at:stamp(),editor:"SYSTEM",events:clone(ev)}]}}world.records[date]=rec;world.motifs.redUmbrella=world.motifs.redUmbrella||rec.events.some(e=>e.kind==="motif");world.logs.unshift(`${lt()} CONSISTENCY CHECK PASSED`,`${lt()} RECORD ${existing?"UPDATED":"RETRIEVED"}`,`${lt()} INDEX ${existing?"ACCESSED":"CREATED"}`);if(world.retrievalCount>=14&&world.retrievalCount%5===0)world.logs.unshift(`${lt()} USER ACKNOWLEDGED`);world.logs=world.logs.slice(0,40);selected=date;save();getEl.disabled=false;updateDate();render();renderLogs()},1100)}
function versions(){const rec=world.records[selected];$("#modaldate").textContent=fmt(rec.date)+" / VERSION HISTORY";$("#revisions").innerHTML=rec.revisions.slice().reverse().map(r=>{const before=rec.revisions[r.number-2]?.events,changed=r.events.find((e,i)=>!before||e.text!==before[i]?.text)||r.events[0];return`<article><header><b>v${r.number}</b><time>${r.at}</time><span>変更者：${r.editor}</span></header><p><b>${changed.time}</b>${changed.text}</p></article>`}).join("");modal.classList.add("open")}
function renderLogs(){logsEl.innerHTML=world.logs.length?world.logs.map(x=>`<code>${x}</code>`).join(""):"NO LOCAL OPERATIONS RECORDED"}
dateEl.value=ds();updateDate();render();renderLogs();dateEl.onchange=updateDate;getEl.onclick=()=>retrieve(Boolean(world.records[prev(dateEl.value)]));$("#logtoggle").onclick=()=>logsEl.hidden=!logsEl.hidden;$("#close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open")});
})();
</script>
</body>
</html>
